name: E2E Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: XCUITest E2E (iPhone Simulator)
    runs-on: macos-15
    timeout-minutes: 45

    env:
      E2E_API_URL: http://127.0.0.1:18080/v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker (Colima)
        run: |
          brew install docker docker-compose colima
          colima start --cpu 2 --memory 4 --arch aarch64
          docker info

      - name: Start API backend
        run: docker compose -f docker-compose.test.yaml up -d --wait

      - name: Wait for API health
        run: |
          echo "Waiting for API..."
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:18080/v2/health > /dev/null 2>&1; then
              echo "API ready after ${i}s"
              break
            fi
            sleep 2
            if [ "$i" -eq 90 ]; then
              echo "API failed to start"
              docker compose -f docker-compose.test.yaml logs
              exit 1
            fi
          done

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app

      - name: Run XCUITests
        run: |
          xcodebuild test \
            -project PiggyPulse.xcodeproj \
            -scheme PiggyPulse \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -parallel-testing-enabled NO \
            -only-testing:PiggyPulseUITests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-output.log | grep -E "Test Case|BUILD|error:" || true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: test-output.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop API backend
        if: always()
        run: docker compose -f docker-compose.test.yaml down

      - name: Stop Colima
        if: always()
        run: colima stop
