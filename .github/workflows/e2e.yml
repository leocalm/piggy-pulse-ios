name: E2E Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: XCUITest E2E (iPhone Simulator)
    runs-on: macos-15
    timeout-minutes: 30

    env:
      E2E_API_URL: http://127.0.0.1:18080/v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start API backend
        run: docker-compose -f docker-compose.test.yaml up -d --wait

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:18080/v2/health > /dev/null 2>&1; then
              echo "API ready after ${i}s"
              break
            fi
            sleep 1
            if [ "$i" -eq 60 ]; then
              echo "API failed to start" && exit 1
            fi
          done

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app

      - name: Run XCUITests
        run: |
          xcodebuild test \
            -project PiggyPulse.xcodeproj \
            -scheme PiggyPulse \
            -testPlan E2E \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath test-results/e2e.xcresult \
            E2E_API_URL="${{ env.E2E_API_URL }}" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify 2>/dev/null || true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-xcresult
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop API backend
        if: always()
        run: docker-compose -f docker-compose.test.yaml down
