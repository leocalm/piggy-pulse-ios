name: E2E Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: XCUITest E2E (iPhone Simulator)
    runs-on: macos-15
    timeout-minutes: 30

    env:
      E2E_API_URL: http://127.0.0.1:18080/v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Docker (if not present)
        run: |
          if ! command -v docker &> /dev/null; then
            echo "Docker not found, installing via Homebrew..."
            brew install --cask docker
            open /Applications/Docker.app --background
            echo "Waiting for Docker daemon..."
            for i in $(seq 1 60); do
              if docker info &> /dev/null; then
                echo "Docker ready after ${i}s"
                break
              fi
              sleep 2
              if [ "$i" -eq 60 ]; then
                echo "Docker failed to start" && exit 1
              fi
            done
          else
            echo "Docker already available"
          fi

      - name: Start API backend
        run: docker compose -f docker-compose.test.yaml up -d --wait

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:18080/v2/health > /dev/null 2>&1; then
              echo "API ready after ${i}s"
              break
            fi
            sleep 1
            if [ "$i" -eq 60 ]; then
              echo "API failed to start" && exit 1
            fi
          done

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app

      - name: Run XCUITests
        run: |
          xcodebuild test \
            -project PiggyPulse.xcodeproj \
            -scheme PiggyPulse \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -parallel-testing-enabled NO \
            -resultBundlePath test-results/e2e.xcresult \
            -only-testing:PiggyPulseUITests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-output.log | tail -50

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-xcresult
          path: |
            test-results/
            test-output.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop API backend
        if: always()
        run: docker compose -f docker-compose.test.yaml down
